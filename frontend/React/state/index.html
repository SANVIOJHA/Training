<!-- /*
state is normal JS object which is responsible to hold data, and update it according to changes

functional based components are stateless component

if we want to make functional based component as statefull co we need to use hook -> useState()

useState()
usestate is reacthook which returns 1 array which contains 2 elements inside it, 
1st element is state variable and 2nd element is updater function which is used to update the state variable also usestate is accepting 1 initial value

syntax----
[state,setstate]=useState(initialValue)

*/ -->
