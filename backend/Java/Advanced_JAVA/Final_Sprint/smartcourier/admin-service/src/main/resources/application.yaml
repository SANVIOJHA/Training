server:
  port: 8084

spring:
  application:
    name: admin-service

  datasource:
    url: jdbc:mysql://localhost:3306/smartcourier_admin_db
    username: root
    password: tiger
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    hostname: localhost
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: admin-service:8084