server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://localhost:3306/smartcourier_auth_db
    username: root
    password: tiger

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  cloud:
    inetutils:
      ignored-interfaces:
        - docker0
        - veth.*
        - br-.*
      preferred-networks:
        - 127.0.0.1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    hostname: localhost
    prefer-ip-address: true
    ip-address: 127.0.0.1
    non-secure-port: 8081
    instance-id: auth-service:8081