<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* Change bullet style */
        ul {
            list-style: circle;
        }

        /* Direct child li styling */
        ul > li {
            color: darkgoldenrod;
        }
    </style>
</head>

<body>

    <h1>Ingredients for Biryani</h1>
    <ul>
        <li>Rice</li>

        <!-- Nested list MUST be inside li -->
        <li>Chicken
            <ul>
                <li>Fried</li>
                <li>Grilled</li>
                <li>Roasted</li>
            </ul>
        </li>

        <li>Paneer</li>
    </ul>

    <h2>Fighter Jet</h2>
    <ul>
        <li>Spices</li>
        <li>Gas/Electric</li>
    </ul>

    <h2>Ingredients for Lassi</h2>
    <ul>
        <li>Curd</li>
        <li>Water</li>

        <!-- Correct nesting -->
        <li>Sugar
            <ul>
                <li>White Sugar</li>
                <li>Brown Sugar</li>
            </ul>
        </li>

        <li>Malai</li>
        <li>Kova</li>
    </ul>

</body>
</html>
