<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <fieldset>
        <legend><mark>Job Application</mark></legend>
    <form action="">
        <label for="name">Name</label>
        <input type="text" name="username" id="name" placeholder="Enter Full Name" required>  <br><br>
        <label for="email">Email</label>
        <input type="email" name="useremail" id="email"><br><br>
        <label for="phone">Contact no</label>
        <input type="tel" name= "userphone" id="phone" maxlength="10" minlength="10" ><br><br>
       
        <!-- radio -->
         <!-- name should be same for selecting only one value in input-->
        <label for="">Gender</label><br>
        <input type="radio" name="gender" id="male">
        <label for="male">Male</label><br>
        <input type="radio" name="gender" id="female">
        <label for="female">Female</label><br>
        <input type="radio" name="gender" id="other">
        <label for="other">Other</label><br><br>

        <!-- checkbox-->
        <label for="">Skills</label><br>
        <input type="checkbox" name="skill" id="html" checked>
        <label for="html">HTML</label><br>
        <input type="checkbox" name="skill" id="css" checked>
        <label for="css">CSS</label><br>
        <input type="checkbox" name="skill" id="js" >
        <label for="js">JS</label><br>
         <input type="checkbox" name="skill" id="react">
        <label for="react">ReactJs</label><br><br>

        <label for="res">Resume</label>
        <input type="file" name="res" id="" accept=".pdf,.png"><br><br>

        <label for="">DOB</label>
        <input type="date" name="" id="" min="2020-01-01" max="2026-12-12"><br><br>

        <label for="">Branch</label>
        <select name="" id="">
            <option value="">CSE</option>
            <option value="">ECE</option>
            <option value="">CIVIL</option>
        </select> <br><br>
        
        <label for="">Departments</label>
        <select name="" id="">
            <optgroup label="Management">
                <option value="">BBA</option>
                <option value="">MBA</option>
            </optgroup>
            <optgroup label="Engineering">
                <option value="">B.Tech</option>
                <option value="">BCA</option>
                <option value="">MCA</option>
            </optgroup>
        </select>
        <br><br>
        <details open>
            <summary>Upcoming Drives</summary>
            <p>Cisco</p>
            <p>Google</p>
            <p>Microsoft</p>
        </details> <br>
            <label for="exp">Experience</label>
            <input type="range" name="" id="exp" step="20">
        <br><br>
        <label for="">Time</label>
        <input type="time" name="" id=""><br>
        <input type="color" name="" id="">
        <br><br>
        <label for="">Address</label>
        <textarea name="" id=""></textarea>
        <br><br>

        <label for="">Fees</label>
        <input type="text" name="" id="" value="2000000" readonly>
        <br><br>

        <!-- <input type="submit" name=""  id="" value="submit"> -->
        <button>Submit</button>
        <button>Reset</button>
    </form>
   </fieldset>
</body>
</html>
